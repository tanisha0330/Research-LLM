name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run contract tests
        # Tier 1 (ingest logic) always runs. Tier 2 (conformal core, query
        # routing, retrieval guard) needs a built chroma_db/ index, which is
        # gitignored and not present in CI, so those tests skip cleanly rather
        # than fail. No Ollama server is required by any test.
        run: python -m unittest discover -s tests -v
